name: Daily Blog Post

on:
  # Runs every day at 7:00 AM EST (12:00 UTC)
  schedule:
    - cron: "0 12 * * *"

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate-blog.py

      - name: Commit and push new post
        run: |
          git config user.name "MFS Blog Bot"
          git config user.email "blog-bot@mullyfulfillment.com"
          git add blog/posts/
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            TITLE="${{ steps.generate.outputs.title }}"
            git commit -m "blog: ${TITLE:-new daily post}"
            git push
          fi
