name: Daily Blog Post

on:
  # Runs every day at 7:00 AM EST (12:00 UTC)
  schedule:
    - cron: "0 12 * * *"

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic markdown

      - name: Verify setup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Go to Settings → Secrets → Actions and add it."
            exit 1
          fi
          if [ ! -f scripts/generate-blog.py ]; then
            echo "::error::scripts/generate-blog.py not found. Make sure you run this workflow on the correct branch."
            exit 1
          fi
          echo "Setup verified. API key is set, script exists."

      - name: Generate and publish blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          python scripts/generate-blog.py

      - name: Commit and push new post
        run: |
          set -e
          git config user.name "MFS Blog Bot"
          git config user.email "blog-bot@mullyfulfillment.com"
          git add blog/

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "::warning::No new posts to commit. The script may have detected an existing post for today."
            exit 0
          fi

          DATESTAMP=$(date +%Y-%m-%d)
          git commit -m "blog: new post for ${DATESTAMP}"
          git push
          echo "Post committed and pushed."
