  <!-- Open Graph -->

  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="MFS — Mully Fulfillment Services">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MFS Blog — eCommerce Fulfillment Insights">
  <meta name="twitter:description" content="Insights on 3PL operations, shipping strategy, and scaling DTC brands from Detroit's founder-run fulfillment team.">
  <meta name="twitter:image" content="https://cdn.shopify.com/s/files/1/0561/0530/4256/files/Untitled_design_19.png?v=1772057565">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "MFS Blog — eCommerce Fulfillment Insights",
    "description": "Insights on eCommerce fulfillment, 3PL operations, shipping strategy, and scaling DTC brands from the founder-run team at Mully Fulfillment Services.",
    "url": "https://mullyfulfillment.com/blog/",
    "isPartOf": { "@type": "WebSite", "name": "MFS — Mully Fulfillment Services", "url": "https://mullyfulfillment.com" },
    "publisher": { "@type": "Organization", "name": "MFS — Mully Fulfillment Services", "url": "https://mullyfulfillment.com" }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/blog.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23111' width='100' height='100' rx='12'/><text x='50' y='68' font-size='52' font-weight='800' font-family='system-ui' fill='%232dd4a8' text-anchor='middle'>M</text></svg>">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav nav--scrolled" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="nav__inner">
        <a href="/" class="nav__logo" aria-label="Mully Fulfillment"><img src="/assets/images/mfs-logo.svg" alt="Mully Fulfillment"></a>
        <ul class="nav__links">
          <li><a href="/#differentiator">Why MFS</a></li>
          <li><a href="/#metrics">Performance</a></li>
          <li><a href="/blog/" class="nav__link--active">Blog</a></li>
          <li><a href="/#apply" class="btn btn--primary nav__cta">Book Appointment</a></li>
        </ul>
        <button class="nav__toggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="nav__mobile-overlay" role="dialog" aria-label="Mobile navigation">
    <button class="nav__mobile-close" aria-label="Close menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <a href="/#differentiator">Why MFS</a>
    <a href="/#metrics">Performance</a>
    <a href="/blog/">Blog</a>
    <a href="/#apply" class="btn btn--primary">Book Appointment</a>
  </div>

  <!-- Blog Header -->
  <section class="blog-header">
    <div class="container">
      <span class="label">Blog</span>
      <h1>Fulfillment <span style="color: var(--color-teal)">Insights.</span></h1>
      <p>Operational knowledge from a team that ships thousands of orders every week.</p>
    </div>
  </section>

  <!-- Blog Posts Grid -->
  <section class="blog-listing">
    <div class="container">
      <div class="blog-grid" id="blog-grid">
        <!-- Posts loaded dynamically from posts.json -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__logo"><img src="/assets/images/mfs-logo-white.svg" alt="Mully Fulfillment"></div>
        <p class="footer__text">Detroit Precision. Silicon Valley Speed.</p>
        <ul class="footer__links">
          <li><a href="/#differentiator">Why MFS</a></li>
          <li><a href="/#apply">Apply</a></li>
          <li><a href="/blog/">Blog</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script>
    fetch('/blog/posts.json')
      .then(function (r) { return r.json(); })
      .then(function (posts) {
        var grid = document.getElementById('blog-grid');
        posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
        posts.forEach(function (post) {
          var d = new Date(post.date + 'T12:00:00');
          var dateStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
          var card = document.createElement('a');
          card.href = '/blog/' + post.slug;
          card.className = 'blog-card';
          card.innerHTML =
            '<div class="blog-card__meta">' +
              '<span class="blog-card__date">' + dateStr + '</span>' +
              '<span class="blog-card__tag">' + post.tag + '</span>' +
            '</div>' +
            '<h2 class="blog-card__title">' + post.title + '</h2>' +
            '<p class="blog-card__excerpt">' + post.excerpt + '</p>' +
            '<span class="blog-card__read">Read article &rarr;</span>';
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
